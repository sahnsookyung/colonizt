version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Seoul
updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      # typescript-eslint 8.70.1 requires TypeScript <6.1.0.
      # Review compiler major upgrades separately with its parser and lint tooling.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies

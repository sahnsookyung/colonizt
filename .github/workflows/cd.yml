name: CD - Build & Push Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: server
            dockerfile: ./Dockerfile.server
            image: colonizt-server
          - service: web
            dockerfile: ./Dockerfile.web
            image: colonizt-web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/sahnsookyung/${{ matrix.image }}:latest
            ghcr.io/sahnsookyung/${{ matrix.image }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=https://colonizt.sookyungahn.com
          cache-from: type=gha,scope=colonizt-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=colonizt-${{ matrix.service }}
